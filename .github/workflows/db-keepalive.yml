# MONITOR (not the keep-alive): fails loudly when the production API
# serves an empty dataset. The actual keep-alive is an in-process
# daily ping inside the TCP server (mcp-server/src/db/keepalive.ts) —
# GitHub cron proved days-late on this quiet repo in July 2026, which
# is tolerable for an alert and unacceptable for the pause deadline.
#
# Supabase pauses free projects after ~7 days without activity (and
# eventually deletes contents if never restored — we got the warning
# in July 2026). This ping exercises a real database query through
# the production backend every 3 days, which counts as activity.
#
# Retire this workflow when the project moves to a paid tier (which
# also brings daily backups — recommended before the first pilot).

name: db-keepalive
on:
  schedule:
    - cron: '17 6 * * *'   # daily; GH cron drifts on quiet repos, daily absorbs it
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase directly (proves the database is up)
        # The publishable key is public by design (it ships in the Word pane)
        # and, since migration 019, reads no rows. PostgREST still has to
        # run the query against Postgres, so a 200 means the database is
        # awake; a paused project answers 5xx/540.
        env:
          SUPABASE_URL: https://fjshrfjahpmtlcntqfnq.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_lVo9d5uw8ybNWx_37Xapyw_RHHbbSUa
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 30 -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/rest/v1/positions?select=id&limit=1")
          echo "Supabase REST answered HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase answered HTTP $CODE — database may be paused or unreachable"
            exit 1
          fi
      - name: Backend enforces sign-in (data route must answer 401)
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 30 https://api.audrey.xeqtor.com/api/clients)
          echo "backend /api/clients without sign-in: HTTP $CODE"
          if [ "$CODE" != "401" ]; then
            echo "::error::Backend answered $CODE without sign-in (expected 401) — check REQUIRE_AUTH and that the service is up"
            exit 1
          fi
      - name: Ping TCP server health
        run: curl -sf -m 30 https://audrey-tcp-production.up.railway.app/health
